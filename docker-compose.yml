# PropPulse — full-stack compose file (SPEC §12, ADR-7/ADR-8).
#
#   cp .env.example .env                 # required: compose reads env_file .env
#   docker compose up --build            # backend + frontend
#   docker compose --profile mlflow up   # + optional MLflow tracking server
#
# Builds VERIFIED on Docker Server 29.4.0 (2026-08-07) — full smoke evidence in
# reports/DOCKER_SMOKE.md. Default host ports: backend :8000, frontend :8080,
# mlflow :5000. Where those are occupied, docker-compose.alt-ports.yml remaps
# to 18000/18080/15000 — opt-in only, compose never merges it automatically:
#   docker compose -f docker-compose.yml -f docker-compose.alt-ports.yml up --build
# See docker/README.md.
name: proppulse

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: proppulse-backend:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Prediction JSONL log persists on the host (SPEC §10 schema) so the
      # scheduled drift check can read the same window the API writes.
      - ./logs:/app/logs
      # Drift report (reports/drift/latest.json) persists too — /metrics
      # surfaces whatever the last scheduled drift check wrote.
      - ./reports/drift:/app/reports/drift
    healthcheck:
      # python:3.12-slim ships no curl/wget; urllib is always available.
      # Non-2xx or a connection failure raises -> non-zero exit -> unhealthy.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      # Model artifacts (incl. the calibrated RF) load in the lifespan startup;
      # allow ample warm-up before failures count.
      start_period: 40s
    # Headroom for uvicorn's --timeout-graceful-shutdown 10 (image CMD) so a
    # request still draining at the 10s mark is not SIGKILLed at the boundary.
    stop_grace_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Baked into the bundle by Vite at build time (SPEC §9). The browser
        # resolves this against the HOST, so it is the published backend port.
        VITE_API_URL: http://localhost:8000
    image: proppulse-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships busybox wget; -q -O /dev/null discards the body.
      # Non-2xx or a connection failure exits non-zero -> unhealthy. nginx
      # starts almost instantly, so a short start_period suffices.
      # Probe 127.0.0.1, not localhost: on current nginx:alpine, localhost
      # resolves to ::1 first while docker/nginx.conf binds IPv4 only
      # (listen 80;), and busybox wget does not fall back — every probe
      # would be refused despite nginx serving fine (smoke 2026-08-24).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Static file serving drains instantly; don't wait the default 10s on
    # stop/restart.
    stop_grace_period: 5s
    # nginx only writes its pid file and client/proxy temp dirs at runtime
    # (access/error logs are symlinks to /dev/stdout|stderr), so the root
    # filesystem can be read-only with those paths backed by tmpfs.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped

  mlflow:
    # Opt-in tracking UI over the local file store (ADR-8). Start with:
    #   docker compose --profile mlflow up mlflow
    # Tag pinned to the mlflow version in requirements.txt (mlflow==3.15.1)
    # so the server CLI and the in-process client never skew.
    image: ghcr.io/mlflow/mlflow:v3.15.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    environment:
      # MLflow 3.15 refuses file-store URIs unless this is set (SPEC §14);
      # ml/tracking.py only sets it for in-process imports, not the server CLI.
      MLFLOW_ALLOW_FILE_STORE: "true"
    volumes:
      - ./mlruns:/mlruns
    ports:
      - "5000:5000"
    profiles:
      - mlflow
    restart: unless-stopped
