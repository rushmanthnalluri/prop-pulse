# PropPulse frontend — nginx site config (SPEC §9).
# Serves the Vite production bundle with SPA history-fallback: unknown paths
# return index.html so client-side routing (React Router) works on refresh.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets compress well; keep payloads small.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits fingerprinted files under /assets/ — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
