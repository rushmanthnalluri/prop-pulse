# PropPulse frontend — nginx site config (SPEC §9).
# Serves the Vite production bundle with SPA history-fallback: unknown paths
# return index.html so client-side routing (React Router) works on refresh.
#
# Production behavior:
# - index.html and every other non-/assets/ response (favicon, SPA fallback)
#   is served `Cache-Control: no-cache` — browsers may store it but must
#   revalidate (ETag, on by default) on every load, so a new deploy can never
#   leave users on a stale app shell pointing at deleted fingerprinted assets.
# - /assets/ holds Vite's fingerprinted files and stays `expires 1y; immutable`.
# - Security headers + CSP are set at server level and marked `always` so they
#   also cover error responses. nginx drops ALL inherited add_headers inside
#   any location that sets its own, so /assets/ re-adds the full set.
# - server_tokens off: don't advertise the nginx version.
server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (server level; re-added inside /assets/ below) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP scoped to what the bundle actually uses: Google Fonts (stylesheet +
    # font files), OpenStreetMap standard map tiles, data: URIs (inline SVG chevrons
    # in styles.css), and the two API origins the browser calls directly via
    # VITE_API_URL (local default + Render). style-src needs 'unsafe-inline'
    # because Leaflet/React/recharts set inline style attributes. No
    # upgrade-insecure-requests — it would break http://localhost API calls.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' http://localhost:8000 https://prop-pulse-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Revalidate-on-load for everything that isn't a fingerprinted asset —
    # this is what keeps index.html fresh across deploys.
    add_header Cache-Control "no-cache";

    # Static assets compress well; keep payloads small.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits fingerprinted files under /assets/ — safe to cache forever.
    # This location sets its own add_headers, so nginx inheritance drops the
    # server-level set — the security headers are repeated here on purpose.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' http://localhost:8000 https://prop-pulse-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
