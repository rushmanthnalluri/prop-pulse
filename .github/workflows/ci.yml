# PropPulse CI (SPEC §11/§12).
# Use Node 24-native GitHub actions so the runner no longer emits Node 20
# deprecation warnings (checkout/setup-node/setup-python/upload-artifact).
# - python:       pinned dev environment on Python 3.12 + strict pip-audit
#                 gate + the full test suite
# - frontend:     install + npm audit gate + ESLint + production build of the
#                 Vite app
# - docker:       static validation of the compose files — base alone and
#                 merged with docker-compose.alt-ports.yml (no builds/pushes/
#                 secrets)
# - docker-build: builds both images and smoke-tests the backend container
#                 (GET /health must return 200; no pushes/secrets)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Dependency security is a hard gate. No historical exception is carried
      # into the upgraded stack; the current resolver/audit result is the truth.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt
          pip-audit --strict -r backend/requirements.txt

      # pytest.ini sets pythonpath=.; testpaths = tests backend/tests.
      # Integration tests use the committed processed data + champion artifacts.
      - name: Run tests
        run: python -m pytest tests backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Same pattern as docker/frontend.Dockerfile: npm ci when the lock file
      # is committed (reproducible), npm install while it is absent.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Same gate as the Python audit: reports/SECURITY.md §1.2 records zero
      # accepted npm vulnerabilities, so any new high/critical finding fails.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # ESLint gate (npm run lint -> eslint .): fails the job on lint errors
      # before the slower production build runs.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # compose reads env_file .env; derive it from the committed example so
      # validation works on a fresh checkout (no secrets involved).
      - name: Prepare env file
        run: cp .env.example .env

      # Base file alone. Plain `config` is deliberate: no
      # docker-compose.override.yml exists in the tree, so this validates
      # exactly the default config (ports 8000/8080/5000).
      - name: Validate base compose configuration
        run: docker compose config -q

      # Opt-in alternative port mapping (18000/18080/15000) for hosts where
      # the default ports are occupied; must stay mergeable with the base.
      - name: Validate merged alt-ports compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.alt-ports.yml config -q

  # Real image builds (ubuntu-latest ships docker preinstalled) plus a runtime
  # smoke test of the backend container: run it, poll GET /health until the
  # champion artifacts finish loading at startup (bounded warm-up budget of
  # ~120s), dump container logs on failure, and always tear the container
  # down. Builds only — nothing is pushed.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same build commands as docker/README.md; context is the repo root so
      # ml/, backend/, models/ and the required data files are included.
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t proppulse-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t proppulse-frontend:ci .

      - name: Start backend container (Render free-tier memory limit)
        run: docker run -d --memory=512m --memory-swap=512m --name proppulse-backend-ci -p 8000:8000 proppulse-backend:ci

      # /ready is the deployment readiness gate: it returns 200 only after
      # required champion artifacts are loaded. Poll it with the same bounded
      # 120s warm-up budget; /health remains the liveness smoke above it.
      - name: Smoke-test backend health and readiness
        run: |
          for i in $(seq 1 60); do
            health=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            ready=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ready || true)
            if [ "$health" = "200" ] && [ "$ready" = "200" ]; then
              echo "backend healthy and ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy+ready within 120s — container logs:"
          docker logs proppulse-backend-ci
          exit 1

      # Regression for the production outage: the API and one real training
      # job must coexist under Render's 512 MiB cgroup without the API being OOM-killed.
      - name: Smoke-test bounded training under 512 MiB
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {} if data is None else {"Content-Type": "application/json"}
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.status, json.loads(response.read())

          code, accepted = request(
              "/workflow/datasets/ames/jobs",
              "POST",
              {"objective": "regression", "candidates": ["linear"]},
          )
          assert code == 202, (code, accepted)
          job_id = accepted["job_id"]
          deadline = time.monotonic() + 120
          terminal = None
          while time.monotonic() < deadline:
              _, health = request("/health")
              assert health.get("status") == "ok", health
              _, status = request(f"/workflow/jobs/{job_id}")
              if status.get("status") in {"done", "failed"}:
                  terminal = status
                  break
              time.sleep(2)
          assert terminal is not None, f"training timed out: {job_id}"
          assert terminal["status"] == "done", terminal
          _, final_health = request("/health")
          assert final_health.get("status") == "ok", final_health
          print(f"bounded training succeeded: {job_id}; API remained healthy")
          PY

      - name: Dump backend logs after smoke failure
        if: failure()
        run: docker logs proppulse-backend-ci || true

      - name: Remove backend container
        if: always()
        run: docker rm -f proppulse-backend-ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install E2E dependencies and Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start backend
        env:
          CORS_ORIGINS: http://localhost:5300
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8200 > /tmp/proppulse-backend.log 2>&1 &
          echo $! > /tmp/proppulse-backend.pid
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8200/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/proppulse-backend.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8200
        run: |
          npm run dev -- --host 127.0.0.1 --port 5300 --strictPort > /tmp/proppulse-frontend.log 2>&1 &
          echo $! > /tmp/proppulse-frontend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5300/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proppulse-frontend.log
          exit 1

      - name: Run browser E2E suite
        working-directory: e2e
        run: npm test
        env:
          CI: true

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proppulse-e2e-${{ github.sha }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump E2E service logs
        if: failure()
        run: |
          cat /tmp/proppulse-backend.log || true
          cat /tmp/proppulse-frontend.log || true

      - name: Stop E2E services
        if: always()
        run: |
          kill $(cat /tmp/proppulse-frontend.pid) 2>/dev/null || true
          kill $(cat /tmp/proppulse-backend.pid) 2>/dev/null || true
  # One generated source of release evidence. This job never hides an upstream
  # failure: it writes the statuses even when a gate failed, uploads the report,
  # then returns failure so a release cannot accidentally be marked green.
  verification:
    if: ${{ always() }}
    needs: [python, frontend, docker, docker-build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate verification report
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p reports/verification
          cat > reports/verification/latest.md <<EOF
          # PropPulse CI verification

          - Commit: \`$COMMIT_SHA\`
          - Ref: \`$REF_NAME\`
          - Run: [$RUN_ID]($RUN_URL)

          | Gate | Result |
          |---|---|
          | Python tests + dependency audit | $PYTHON_RESULT |
          | Frontend audit + lint + build | $FRONTEND_RESULT |
          | Compose validation | $DOCKER_RESULT |
          | Docker build + health/readiness smoke | $DOCKER_BUILD_RESULT |
          | Browser E2E | $E2E_RESULT |

          ## Release gate

          The exact commit is release-verifiable only when every required upstream
          gate is \`success\`. Historical audit/report counts are not substituted.
          EOF
          cat > reports/verification/latest.json <<EOF
          {
            "commit": "$COMMIT_SHA",
            "ref": "$REF_NAME",
            "run_id": "$RUN_ID",
            "run_url": "$RUN_URL",
            "gates": {
              "python": "$PYTHON_RESULT",
              "frontend": "$FRONTEND_RESULT",
              "docker": "$DOCKER_RESULT",
              "docker-build": "$DOCKER_BUILD_RESULT",
              "e2e": "$E2E_RESULT"
            }
          }
          EOF
          cat reports/verification/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification report
        uses: actions/upload-artifact@v7
        with:
          name: proppulse-verification-${{ github.sha }}
          path: reports/verification/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release gate
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$DOCKER_BUILD_RESULT" = success